version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agenda_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda123}
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: